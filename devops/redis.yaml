apiVersion: apps/v1
kind: Deployment
metadata:
  name: violin-redis
  namespace: devops
  labels:
    app: violin-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: violin-redis
  template:
    metadata:
      labels:
        app: violin-redis
    spec:
      nodeName: worker1
      containers:
        - name: violin-redis
          image: ccr.ccs.tencentyun.com/violin/violin-redis:1.0
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "50m"
              memory: "50Mi"
            limits:
              cpu: "100m"
              memory: "100Mi"
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
      imagePullSecrets:
        - name: devops-secret
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: devops
spec:
  type: NodePort
  selector:
    app: violin-redis
  ports:
    - protocol: TCP
      port: 6379 # 服务暴露端口
      targetPort: 6379 # 容器实际端口
      nodePort: 32679
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: devops
data:
  redis.conf: |
    requirepass 123456
