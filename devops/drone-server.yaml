kind: Deployment
apiVersion: apps/v1
metadata:
  name: drone
  namespace: drone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drone
  template:
    metadata:
      labels:
        app: drone
    spec:
      volumes:
        - name: drone-data
          emptyDir: {}
      containers:
        - name: drone
          # 2.2 的不行，不知道为什么
          image: "ccr.ccs.tencentyun.com/violin/drone:2"
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: DRONE_AGENTS_ENABLED
              value: "true"
            - name: DRONE_DATABASE_DATASOURCE
              value: /var/lib/drone/drone.sqlite
            - name: DRONE_DATABASE_DRIVER
              value: sqlite3
            - name: DRONE_GITEE_SERVER
              value: "https://gitee.com"
            - name: DRONE_SERVER_HOST
              value: "violin-work.online"
            - name: DRONE_GITEE_CLIENT_ID
              value: bc58a8cfccfdce489ed9dfd05cd088d0d6effb45a577f2ee7583790435326211
            - name: DRONE_GITEE_CLIENT_SECRET
              value: fe7d907ce319abc0634388574adef7ba8174f60e99155d720a6d6149e0cc67fc
            - name: DRONE_SERVER_PROTO
              value: https
            - name: DRONE_RPC_SECRET
              value: qwertyuiop
            - name: DRONE_USER_CREATE
              value: "username:13332247026,admin:true"
            - name: DRONE_LOGS_DEBUG
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 50m
              memory: 100Mi
          volumeMounts:
            - name: drone-data
              mountPath: /var/lib/drone
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      nodeName: master
      securityContext: {}
      imagePullSecrets:
        - name: devops-secret
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
apiVersion: v1
kind: Service
metadata:
  name: drone-service
  namespace: drone
  labels:
    app: drone
spec:
  #  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      #      nodePort: 30080
      protocol: TCP
  selector:
    app: drone
