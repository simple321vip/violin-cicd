---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: devops
  name: drone
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - create
      - delete
      - list
      - watch
      - update
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: drone
  namespace: devops
subjects:
  - kind: ServiceAccount
    name: default
    namespace: devops
roleRef:
  kind: Role
  name: drone
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-runner
  namespace: devops
  labels:
    app.kubernetes.io/name: drone-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: drone-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drone-runner
    spec:
      hostNetwork: true
      containers:
        - name: drone-runner
          image: crpi-ktn0pod7hv5m0nmv.cn-beijing.personal.cr.aliyuncs.com/violin-home/drone-runner-kube:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 200Mi
          env:
            - name: DRONE_RPC_HOST
              value: www.violin-work.online
            - name: DRONE_RPC_PROTO
              value: https
            - name: DRONE_RPC_SECRET
              value: qawsedrftg # Drone Server部署时候填写的secret
            - name: DRONE_IMAGE_CLONE
              value: ccr.ccs.tencentyun.com/violin/drone-git:latest
            - name: DRONE_IMAGE_PLACEHOLDER
              value: ccr.ccs.tencentyun.com/violin/drone-placeholder:1
            - name: DRONE_SERVICE_ACCOUNT_DEFAULT
              value: default
          volumeMounts:
            - name: docker-config
              mountPath: /var/run/
            - name: kubectl-config
              mountPath: /root/.kube/
      volumes:
        - name: docker-config
          hostPath:
            path: /var/run/
            type: DirectoryOrCreate
        - name: kubectl-config
          hostPath:
            path: /root/.kube/
            type: DirectoryOrCreate
      imagePullSecrets:
        - name: aliyun-registry-secret
